  <circle cx="88" cy="54" r="3" fill="#E9A23B"/>
  <!-- starry eyes -->
  <circle cx="44" cy="64" r="8.5" fill="#fff"/>
  <circle cx="68" cy="64" r="8.5" fill="#fff"/>
  <path d="M44 59 l1.4 3 3.2.4 -2.4 2.2 .6 3.2 -2.8 -1.5 -2.8 1.5 .6 -3.2 -2.4 -2.2 3.2 -.4 Z" fill="#E9A23B"/>
  <path d="M68 59 l1.4 3 3.2.4 -2.4 2.2 .6 3.2 -2.8 -1.5 -2.8 1.5 .6 -3.2 -2.4 -2.2 3.2 -.4 Z" fill="#E9A23B"/>
  <!-- big laugh -->
  <path d="M44 72 Q56 92 68 72 Q56 80 44 72 Z" fill="#8A4638"/>
  <ellipse cx="56" cy="80" rx="7" ry="4" fill="#E88B7A"/>
