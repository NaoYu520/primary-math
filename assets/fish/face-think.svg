  <ellipse cx="56" cy="84" rx="25" ry="18" fill="#FCFDF9"/>
  <!-- cheek-rest fin -->
  <path d="M34 78 Q24 86 28 96 Q38 92 42 84 Z" fill="#2B8A83"/>
  <!-- mortarboard -->
  <path d="M30 36 L62 26 L92 36 L62 46 Z" fill="#2A4A7F"/>
