  <path d="M86 58 Q94 48 90 40 Q80 46 78 56 Z" fill="#2B8A83"/>
  <path d="M96 20 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1 Z" fill="#E9A23B"/>
  <!-- mortarboard -->
  <path d="M30 34 L62 24 L92 34 L62 44 Z" fill="#2A4A7F"/>
  <rect x="50" y="40" width="24" height="8" rx="3" fill="#2A4A7F"/>
