  <circle cx="88" cy="56" r="3" fill="#E9A23B"/>
  <!-- eyes glancing up -->
  <circle cx="44" cy="64" r="8.5" fill="#fff"/>
  <circle cx="68" cy="64" r="8.5" fill="#fff"/>
  <circle cx="46" cy="61" r="4" fill="#22303C"/>
  <circle cx="70" cy="61" r="4" fill="#22303C"/>
  <circle cx="47.5" cy="59.5" r="1.4" fill="#fff"/>
  <circle cx="71.5" cy="59.5" r="1.4" fill="#fff"/>
  <!-- small o mouth -->
  <circle cx="56" cy="78" r="4" fill="#8A4638"/>
  <!-- cheeks -->
  <circle cx="34" cy="74" r="4.5" fill="#F6BBA3" opacity="0.85"/>
  <circle cx="78" cy="74" r="4.5" fill="#F6BBA3" opacity="0.85"/>
  <!-- question mark -->
  <path d="M96 20 q6 -6 11 -1 q4 4 0 8 q-3 2 -3 6" stroke="#E9A23B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="104" cy="40" r="2.6" fill="#E9A23B"/>
