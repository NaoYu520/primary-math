<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="闹闹鱼庆祝">
  <defs>
    <linearGradient id="fc-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B8A83"/>
